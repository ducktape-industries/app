# The one toolchain this tree builds with: 1.96.1, the same pin as the
# programs repository's. `targets`: aarch64-unknown-linux-musl because
# ops/macos-preflight.sh, the node's preflight, checks for it; the phone's
# (`crates/phone`): Android phones and the x86_64 emulator, iOS phones and
# the Apple-silicon simulator; the web's (J-137): wasm32-unknown-unknown.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-unknown-linux-musl",
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "wasm32-unknown-unknown",
]
