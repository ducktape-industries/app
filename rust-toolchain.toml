# The one toolchain this tree builds with: 1.96.1, the same pin as the
# modules repository's. Nothing here builds for another triple: `targets`
# keeps aarch64-unknown-linux-musl only because ops/macos-preflight.sh, the
# node's preflight, checks for it.
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-musl"]
