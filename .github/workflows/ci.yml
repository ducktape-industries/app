# Linux only; macOS runners are deliberately excluded.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  GIT_CONFIG_COUNT: "3"
  GIT_CONFIG_KEY_0: url.https://github.com/ducktape-industries/ducktape.insteadOf
  GIT_CONFIG_VALUE_0: duck://duckpond-725bcad1/forge/core
  GIT_CONFIG_KEY_1: url.https://github.com/ducktape-industries/programs.insteadOf
  GIT_CONFIG_VALUE_1: duck://duckpond-725bcad1/forge/programs
  GIT_CONFIG_KEY_2: url.https://github.com/ducktape-industries/gpui-pre.insteadOf
  GIT_CONFIG_VALUE_2: duck://duckpond-725bcad1/forge/gpui-pre

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libasound2-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
      - run: cargo clippy --locked --workspace --tests --no-deps --features ax-door -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
