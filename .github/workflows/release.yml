# The app is built for Linux x86_64 (GitHub's Ubuntu) and macOS arm64 (the
# self-hosted runner mac-byeongsu) and published twice:
# - on the prerelease bin-<commit>: the Linux binary as a tarball, the Mac
#   app as a Developer ID signed, notarized DMG and as a tarball of
#   Ducktape.app;
# - to the self-update's prefix (dl.ducktape.industries/app/, Cloudflare R2): the
#   two tarballs named by their sha256, then the channel's one file, its
#   manifest and the signature over it.
# Two channels, one signing key, one order: a release's sequence is its
# commit's committer time, on either channel.
# - stable: each time `main` moves;
# - nightly: each time `dev` moves, and once a day (a retry for a run that
#   failed) and on demand from dev's head, skipped when the published
#   nightly is not older.
# The signing key and the bucket's credentials live in the `release`
# environment, which admits runs on `dev` and `main` only. The Developer ID
# certificate (organization secrets) and the notary key are read by one
# job, macos-sign, which runs in that environment too. Neither job that
# holds a secret builds the built commit: macos-sign runs that commit's
# ops/sign-app-macos.sh over the build job's bundle (with that commit's
# entitlements, the ones its app needs), publish builds the signer from
# `main`, and the archives reach both as artifacts of the build jobs, which
# see no secret.
name: release

on:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name == 'main' && 'stable' || 'nightly' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which channel, which commit, and whether the bucket already has it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      sha: ${{ steps.plan.outputs.sha }}
      sequence: ${{ steps.plan.outputs.sequence }}
      version: ${{ steps.plan.outputs.version }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      # a schedule or a dispatch builds dev's head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}
      - id: plan
        run: |
          channel=nightly
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then channel=stable; fi
          sha=$(git rev-parse HEAD)
          sequence=$(git show -s --format=%ct HEAD)
          # a committer time is whatever the committer's clock said: one from
          # the future would pin every install that takes it past every
          # release until that date comes
          if [ "$sequence" -gt $(( $(date +%s) + 600 )) ]; then
            echo "::error::$sha is dated $sequence, in the future: not published"
            exit 1
          fi
          # before the first publish (or with the bucket unreachable) there
          # is nothing to compare with
          published=$(curl -fsS --max-time 20 "https://dl.ducktape.industries/app/$channel.json" 2>/dev/null \
            | jq -r '.manifest | fromjson | .sequence // 0' 2>/dev/null || true)
          published=${published:-0}
          skip=false
          if [ "$published" -ge "$sequence" ]; then
            skip=true
            echo "$channel already publishes $published, not older than $sha ($sequence): skipped"
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          {
            echo "channel=$channel"
            echo "sha=$sha"
            echo "sequence=$sequence"
            echo "version=$version"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # fat LTO links in one thread: ~18 min on a 24-core box, more on a hosted runner
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 3
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: bin-${{ needs.plan.outputs.sha }}
      # the release tree, the app at its top: also the update archive
      ASSET: ducktape-app-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libasound2-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --profile dist -p ducktape-app
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$ASSET" -C target/dist ducktape-app
          # Both jobs may try to create the release; the loser finds it made.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease --latest=false --target "$SHA" --title "$TAG" \
            --notes "The ducktape app built at $SHA." \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$ASSET" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: ${{ env.ASSET }}
          retention-days: 7
          overwrite: true

  macos:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: [self-hosted, mac-byeongsu]
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # ad-hoc signed here: macos-sign signs it for real
      - run: ops/bundle-app-macos.sh
        env:
          DUCKTAPE_CARGO_PROFILE: dist
      - run: |
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf ducktape-app-unsigned.app.tar.gz \
            -C target/app-bundle Ducktape.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: ducktape-app-unsigned.app.tar.gz
          retention-days: 1
          overwrite: true

  # Developer ID signs the build job's bundle, images it, notarizes and
  # staples: a throwaway keychain holds the certificate for this job only.
  macos-sign:
    needs: [plan, macos]
    runs-on: [self-hosted, mac-byeongsu]
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: bin-${{ needs.plan.outputs.sha }}
      ASSET: ducktape-app-aarch64-apple-darwin.dmg
      # the update archive: Ducktape.app whole, no AppleDouble files and no
      # extended attributes (its signature lives in its files)
      APP_ASSET: ducktape-app-aarch64-apple-darwin.app.tar.gz
    steps:
      # the built commit's script and entitlements, nothing built here: main
      # may not have the script yet, nor the camera and microphone
      # entitlements the commit's app needs (hardened runtime enforces them)
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-unsigned
          path: unsigned
      - name: keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # codesign reaches the private key through the search list: this
          # keychain joins it until the cleanup step deletes it (which takes
          # it off the list); a list read as empty would drop the login one
          searched=$(security list-keychains -d user | tr -d '" ')
          [ -n "$searched" ] || { echo "::error::the user keychain search list read empty"; exit 1; }
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $searched
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          (umask 077 && printf '%s' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8")
          {
            echo "DUCKTAPE_CODESIGN_KEYCHAIN=$keychain"
            echo "DUCKTAPE_CODESIGN_IDENTITY=$identity"
            echo "DUCKTAPE_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
          } >> "$GITHUB_ENV"
      - name: sign
        env:
          DUCKTAPE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          DUCKTAPE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          mkdir -p signed
          tar xzf unsigned/ducktape-app-unsigned.app.tar.gz -C signed
          ops/sign-app-macos.sh signed/Ducktape.app "$ASSET"
          spctl --assess --type open --context context:primary-signature -v "$ASSET"
          spctl --assess --type execute -v signed/Ducktape.app
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "$APP_ASSET" -C signed Ducktape.app
      - name: cleanup
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both jobs may try to create the release; the loser finds it made.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease --latest=false --target "$SHA" --title "$TAG" \
            --notes "The ducktape app built at $SHA." \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$ASSET" "$APP_ASSET" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: macos-archive
          path: ${{ env.APP_ASSET }}
          retention-days: 7
          overwrite: true

  # Sign the channel's manifest over both archives and upload: archives
  # first (immutable, named by their sha256), then the channel's one file,
  # so a client never reads a manifest whose archive is not there, nor a
  # manifest beside another one's signature. In the `release` environment
  # with macos-sign: `main`'s signer over the build jobs' archives. No cache:
  # the build jobs build whatever commit they are given, and nothing they
  # leave behind reaches the job that holds the key.
  publish:
    needs: [plan, linux, macos-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      SHA: ${{ needs.plan.outputs.sha }}
      SEQUENCE: ${{ needs.plan.outputs.sequence }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: bin-${{ needs.plan.outputs.sha }}
    steps:
      # main, whichever branch ran this: never the built commit
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: macos-archive
          path: assets
      # built before the key is in the environment: no build script runs
      # with it
      - run: cargo build --locked --release -p ducktape-updater --bin publish-release
      - name: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          target/release/publish-release \
            --channel "$CHANNEL" \
            --sequence "$SEQUENCE" \
            --display "$VERSION+${SHA:0:7}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --archive linux-x86_64=assets/ducktape-app-x86_64-unknown-linux-gnu.tar.gz \
            --archive macos-aarch64=assets/ducktape-app-aarch64-apple-darwin.app.tar.gz \
            --out out > upload-order
          cat upload-order
      - name: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          while read -r name; do
            case "$name" in
              *.tar.gz) cache="public, max-age=31536000, immutable" ;;
              *) cache="public, max-age=60" ;;
            esac
            aws s3 cp "out/$name" "s3://$BUCKET/app/$name" \
              --endpoint-url "$ENDPOINT" --cache-control "$cache"
          done < upload-order
