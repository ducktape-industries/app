# cargo-deny: what the app may depend on (`cargo deny check bans licenses`; tools/dep-gate.sh row 7).
# Licenses: the permissive set the dependency graph carries, and MPL-2.0. No GPL or LGPL: a crate offered under
# one of those passes only through another license it is also offered under (cargo-deny takes the OR alternatives).
# Our own crates (this workspace, and programs' and ducktape's from their git repos) carry no license: private.

[graph]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true
ignore-sources = [
    "https://github.com/ducktape-industries/programs",
    "https://github.com/ducktape-industries/ducktape",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
