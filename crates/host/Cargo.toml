# ducktape-host — the blind host core the desktop shell and the phone shell
# share: the renderer (`render`: one wire tree drawn as GPUI elements), the
# runtime (`runtime`: seats, views, the kernel relay, replies, notify,
# store, clipboard, roster), the backend's shared half (`backend`: the
# node client and the frames it signs, the roster's views, prefs, the app's
# own directories), fonts, the product theme, the a11y helpers and the AX
# door (feature `ax-door`).
#
# It names no shell, no window manager and no user program. What a shell
# must provide arrives through its interface file (`src/contract.rs`);
# `tools/dep-gate.sh` keeps the dependency direction.

[package]
name = "ducktape-host"
edition.workspace = true
version.workspace = true
publish = false

[features]
default = ["wasmtime", "ui"]
# the wasmtime view runner (`runner::WasmtimeRunner`) and `program.describe`
# on it: the desktop and Android. Off for iOS, where views run in
# JavaScriptCore (`crates/host-jsc`) and no process of ours may JIT.
wasmtime = ["dep:wasmtime", "describe/host"]
# The window half: gpui-kit and everything drawn with it (`render`, the
# seats' entities, `session`, `a11y`, `fonts`, `theme`, `start`, the
# clipboard, the AX door). Without it the crate is the runtime a host with
# no screen runs (`crates/pushd`): the roster, the kernel contract, the
# notifiers, the store and the notification centre, the backend.
ui = ["dep:gpui-kit", "dep:gpui-base", "dep:image", "dep:usvg", "dep:resvg", "dep:gif"]
# the AX test door (`src/ax`): kit and qa builds, and every test
ax-door = ["ui"]
# gpui's own frame and input histograms into `GET /perf` (docs/perf.md §3.5)
perf-deep = ["ui", "gpui-kit/profiler"]
# the web piece draws pages through CEF (`render/web.rs`, `crates/web`)
web = ["ui", "dep:ducktape-web", "ducktape-web/cef"]
# the camera and microphone pieces open real devices (`render/av.rs`,
# `crates/av`)
av = ["ui", "dep:ducktape-av", "ducktape-av/capture"]
# calls: a camera or microphone piece that publishes into a live track,
# and a remote piece that plays one (`render/call.rs`, `crates/av`'s
# `call`: codecs, the echo-cancelled voice I/O, the mixer)
call = ["av", "ducktape-av/call"]
# the test helpers the desktop shell's tests reach (`*_for_test`,
# `test_style`, ...): on for every test build, never for a shipped one;
# `wat` turns the test views' text into the wasm a runner takes
test-support = ["ui", "gpui-kit/test-support", "wasmtime", "dep:wat", "dep:libc"]

[[test]]
name = "artifact_row"
harness = false
required-features = ["web", "test-support"]

[dependencies]
gpui-kit = { version = "=0.7.3", optional = true }
gpui-base = { version = "=0.7.3", optional = true }
unicode-segmentation = "1"
futures.workspace = true
async-channel = "2"
zeroize.workspace = true
design.workspace = true
describe.workspace = true
sha2.workspace = true
identity.workspace = true
# The roster's full query surface: its programs and its view-only entries.
blob.workspace = true
# a notifier's answers and turn (`view_wire::notifier`); the tests' borsh too
borsh.workspace = true
programs = { git = "https://github.com/ducktape-industries/programs", rev = "9d0f734233c7988f190f3436ffdc7c6927405aa3", package = "programs" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
usvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts"], optional = true }
resvg = { version = "0.46.0", default-features = false, features = ["text", "raster-images"], optional = true }
gif = { version = "0.14", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
# The live lane (`backend/live.rs`): QUIC to the UDP port the node's
# `/v1/live/port` names, the node's key pinned by reading it out of its
# certificate (rustls-webpki, already rustls's own), the websocket beside
# it, and the wire's types from core's leaf crate.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
live-wire.workspace = true
# the node address's host, which the QUIC dial resolves: reqwest's own parser, already in the graph
url = "2"
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
view-wire = { workspace = true, features = ["manifest"] }
program.workspace = true
abi.workspace = true
ducklink.workspace = true
wasmtime = { workspace = true, optional = true }
wasmparser = "0.251"
# a program's blob mapped from the cache's file (`backend::views::Blob`),
# never read into the heap: fontdb's and xkbcommon's own, already in the graph
memmap2 = "0.9"
# `accepts`: the one rule every view runner applies before it compiles a
# view (wasm-mobile SPEC §6.2), so wasmtime and JavaScriptCore take and
# refuse the same views
view-meter = { path = "../view-meter" }
# feature `test-support` only (wasmtime's own `wat` already in the graph)
wat = { version = "1", optional = true }
libc = { workspace = true, optional = true }
# files of the host's own that nothing keeps (a save's landing file, a
# pasted picture, a blob read for a view)
tempfile.workspace = true
# the node's client, shared with the phone; a signer is whatever the shell
# seats (`noded_client::Signer`), so no key crate is named here
noded-client = { path = "../noded-client" }
rt = { package = "ducktape-rt", path = "../rt" }
view-runner = { path = "../view-runner" }
# an artifact's file read and followed (`runtime/kernel/node/artifact.rs`): the files program's own query and reply
files = { git = "https://github.com/ducktape-industries/programs", rev = "9d0f734233c7988f190f3436ffdc7c6927405aa3", package = "files" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# feature `web` only: CEF and everything that names it
ducktape-web = { path = "../web", optional = true }
# feature `av` only: V4L2, AVFoundation, cpal and everything that names them
ducktape-av = { path = "../av", optional = true }

[dev-dependencies]
flate2 = "1"
view-runner = { path = "../view-runner", features = ["test-support"] }
libc.workspace = true
# what the media pieces' tests read off a piece (empty without `av`)
ducktape-av = { path = "../av", features = ["test-support"] }
# paused time for the live session's keep-alive and idle tests
tokio = { version = "1", features = ["test-util"] }
# `backend/live.rs`'s test node: a self-signed certificate of an ed25519 key, as halo makes its own
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# the live tests' node: its key's verifier, as the handshake pins it
keyscheme = { git = "https://github.com/ducktape-industries/ducktape", rev = "58b5d91e97d2f0b0e22a5374b6e2a70037b98f14", package = "keyscheme", features = ["testkit"] }
# the consent card's words for a validators' vote
valset = { git = "https://github.com/ducktape-industries/programs", rev = "9d0f734233c7988f190f3436ffdc7c6927405aa3", package = "valset" }
# the tests' keys: commonware's ed25519, through noded-client's impl
commonware-cryptography.workspace = true
commonware-codec.workspace = true
noded-client = { path = "../noded-client", features = ["commonware"] }
# hand-written wasm for the describe method's hostile-section tests
wat = "1"
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
ducktape-a11y-platform = { path = "../a11y-platform", features = ["test-support"] }
# a fake node's changes socket (`runtime/kernel/node/tests.rs`)
tokio-tungstenite.workspace = true
blobs = { git = "https://github.com/ducktape-industries/programs", rev = "9d0f734233c7988f190f3436ffdc7c6927405aa3", package = "blobs" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# test-support: its headless renderer, which `render/tests/picture_pixels.rs`
# reads pixels back from.
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9", features = ["test-support"] }
