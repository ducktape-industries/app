# noded-client — a ducktape client's side of a node: the `/v1` wire, the
# signed frame, and the flows onto an account (identity, joining from
# another device through the auth host's relay, the keyring binding).
#
# The desktop app (this repo) and the phone (ducktape-industries/mobile)
# both link it; the phone by git rev of this repo. Its programs crates sit on
# the app's ONE programs rev (`[workspace.dependencies]`), so a programs bump
# is one chain: programs -> app (pin + this crate) -> mobile (pin).
#
# It links no core crate (no keystore, keyscheme, ducktape-home): a signer
# is whatever implements `Signer`. `commonware` adds the impl for
# commonware's ed25519 key, the desktop's device key. It is off by default
# because commonware-cryptography links aws-lc-rs on x86_64 and aarch64
# whatever its features, and aws-lc-sys does not build with the Android NDK
# alone; with it off the graph's only TLS provider is ring.

[package]
name = "noded-client"
edition.workspace = true
version.workspace = true
publish = false

[features]
commonware = ["dep:commonware-cryptography"]

[dependencies]
abi.workspace = true
identity.workspace = true
borsh.workspace = true
# a blob's pieces handed on as the connection read them (`BlobStream`)
bytes = "1"
# `stream`: a blob upload streams its bytes, never held whole
reqwest = { workspace = true, features = ["stream"] }
tokio = { version = "1", features = ["time"] }
tokio-tungstenite.workspace = true
futures.workspace = true
sha2.workspace = true
base64.workspace = true
serde_json.workspace = true
rand.workspace = true
tracing.workspace = true
commonware-cryptography = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
