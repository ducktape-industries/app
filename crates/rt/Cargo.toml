# ducktape-rt: the process's runtime where targets differ, the one place a runtime target cfg lives:
# the future and stream a client hands on (`Fut`, `BoxStream`, `MaybeSend`), time (`time`), where a task
# runs (`task`) and the process's own facts (`process`): tokio's and libc's natively, the page's in a browser.

[package]
name = "ducktape-rt"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
futures.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["net", "rt", "time"] }
libc.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"
