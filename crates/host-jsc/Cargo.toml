# ducktape-host-jsc — the iOS view runner (wasm-mobile SPEC §6): views run
# in JavaScriptCore, in ONE hidden WKWebView's page, metered by the
# `view-meter` pass at `prepare`, driven from Rust through objc2. iOS has no
# JIT a process of ours may own, so this is how a view's wasm runs at speed
# there. Everything that names WebKit is iOS-only; the answers' meaning
# (`answer.rs`), the page's bookkeeping (`calls.rs`) and the gate's session
# driver (`gate.rs`) build and are tested on every target.

[package]
name = "ducktape-host-jsc"
edition.workspace = true
version.workspace = true
publish = false

[features]
# the simulator gate (`examples/sim_gate.rs`): the recorded sessions, the
# session driver, and the content process's pid, which only the gate's
# killer reads (a private WebKit key: never in a shipped build)
gate = ["dep:flate2", "dep:sha2", "dep:async-channel", "dep:libc", "objc2-ui-kit/UIViewController"]

[dependencies]
# no wasmtime: views run in the page
ducktape-host = { path = "../host", default-features = false }
view-meter = { path = "../view-meter" }
view-wire.workspace = true
describe.workspace = true
base64.workspace = true
futures.workspace = true
rt = { package = "ducktape-rt", path = "../rt" }
tracing.workspace = true
flate2 = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
async-channel = { version = "2", optional = true }
# the gate's wait for the content process it had killed (`kill(pid, 0)`)
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSData", "NSDictionary", "NSError", "NSEnumerator", "NSKeyValueCoding",
    "NSObject", "NSSet", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSValue",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "UIAccessibility", "UIApplication", "UIResponder", "UIScene",
    "UIView", "UIWindow", "UIWindowScene",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "WKContentWorld", "WKFrameInfo", "WKNavigation", "WKNavigationDelegate",
    "WKURLSchemeHandler", "WKURLSchemeTask", "WKWebViewConfiguration",
] }

[dev-dependencies]
flate2 = "1"
sha2.workspace = true
async-channel = "2"
wat = "1"

# the reference the gate's numbers are pinned against (wasmtime, the
# desktop's runner) and `program.describe`'s own bounds: never on iOS, where
# the gate app is built (examples take the dev-dependencies)
[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
ducktape-host = { path = "../host", features = ["wasmtime"] }
describe = { workspace = true, features = ["host"] }

[[example]]
name = "sim_gate"
required-features = ["gate"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
disallowed_methods = "deny"
