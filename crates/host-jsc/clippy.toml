# The SPEC §13.1 rows for this crate: tests may unwrap; the runner never
# sleeps, spawns a process or reads the environment (the gate's driver, a
# test harness, waits on the page with `wait_for_death` instead of a sleep).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-methods = [
    { path = "std::process::Command::new", reason = "the runner runs inside the app; it names no OS but WebKit" },
    { path = "std::thread::sleep", reason = "the runner waits on events, never on a timer" },
    { path = "std::env::var", reason = "the runner is configured by its RunnerConfig only" },
]
