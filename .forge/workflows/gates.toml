# The app CI (orthory, #engineering 912/913): gates.sh (GATES=check) from the forge repo tools at its main head, then
# clippy for wasm32 (the web shell's too), and the host without default features: its kernel and live tests and its
# clippy. LANE_TESTS: the test targets the check (and build.sh's lane) runs over every crate a change reaches: all of
# them, lib, bins and integration tests.
name = "gates"

[on]
push = ["dev", "main"]
change = ["opened", "updated"]

# #ci hears when a push's check ends failed or errored (orthory: not #engineering)
[notify]
channel = "ci"

[[jobs]]
id = "gates"
runs-on = ["pods"]
cpu = "8"
memory = "19Gi"
scratch = ["/var/tmp/target"]
image = "localhost:5000/toolchain:b240e4516c93@sha256:d80bfd948f37f381542c720e3f67a39c06606e88aec9f66f88aefb295468136b"
steps = [
    "git config --global --add safe.directory '*'",
    "git clone -q \"$(git remote get-url origin | sed 's#/forge/app$#/forge/tools#')\" /var/tmp/tools",
    "sh /var/tmp/tools/gates.sh /work/app",
    "cd /work/app && CARGO_TARGET_DIR=/var/tmp/target cargo clippy --locked --target wasm32-unknown-unknown -p ducktape-rt -p noded-client -p view-runner -p ducktape-host-web -- -D warnings",
    "cd /work/app && CARGO_TARGET_DIR=/var/tmp/target cargo clippy --locked --target wasm32-unknown-unknown -p ducktape-host-web --tests -- -D warnings",
    "cd /work/app && CARGO_TARGET_DIR=/var/tmp/target cargo clippy --locked --target wasm32-unknown-unknown -p ducktape-host --no-default-features --features ui -- -D warnings",
    "cd /work/app && CARGO_TARGET_DIR=/var/tmp/target cargo clippy --locked --target wasm32-unknown-unknown -p ducktape-web-shell -- -D warnings",
    "cd /work/app && CARGO_TARGET_DIR=/var/tmp/target cargo test --locked -p ducktape-host --no-default-features --features wasmtime,ui --lib -- runtime::kernel::tests backend::live::tests",
    "cd /work/app && CARGO_TARGET_DIR=/var/tmp/target cargo clippy --locked -p ducktape-host --no-default-features --lib -- -D warnings",
]

[jobs.env]
GATES = "check"
WORKSPACE_FEATURES = "ax-door"
FEATURE_SETS = "ducktape-web:cef ducktape-host:web"
AGENTS_LINT = "1"
LANE_TESTS = "--tests"
