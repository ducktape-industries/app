# The nightly release: chief's daily Dispatch of "nightly" at dev's head builds Linux in a pod and macOS on the mac relay, the signer Developer ID signs the Mac app and publishes the release record as tag release/nightly/<sequence>, then mirrors it to R2.
# A newer dispatch supersedes a run no runner has taken yet, and a taken run goes on to its end; ops/signer/README.md has the signer's half.
name = "release-nightly"

[on]
dispatch = ["nightly"]
trigger = false
supersede = "unstarted"

[notify]
channel = "ci"

[[jobs]]
id = "linux"
runs-on = ["pods"]
runners = [38]
cpu = "16"
memory = "11Gi"
scratch = ["/var/tmp/target"]
image = "localhost:5000/toolchain:aefa0afb424e@sha256:1fa047b9fc589d51f9a9c4b5ffac1eeca53770414dc16f0f4cef29abb0e5f675"
steps = ["git config --global --add safe.directory '*'", "ops/release-linux.sh \"$OUT\""]

[jobs.env]
CARGO_TARGET_DIR = "/var/tmp/target"

[[jobs]]
id = "macos"
runs-on = ["mac"]
runners = [44]
steps = ["ops/release-macos.sh \"$OUT\""]

[[jobs]]
id = "macos-sign"
runs-on = ["sign:dev.ducktape.app"]
needs = ["macos"]
steps = ["developer-id"]

[[jobs]]
id = "publish"
runs-on = ["sign:dev.ducktape.app"]
needs = ["linux", "macos-sign"]
steps = ["release-manifest"]

[jobs.env]
CHANNEL = "nightly"

[[jobs]]
id = "mirror"
runs-on = ["sign:dev.ducktape.app"]
needs = ["linux", "macos-sign", "publish"]
steps = ["r2-mirror"]

[jobs.env]
CHANNEL = "nightly"
