[package]
edition = "2024"
name = "ducktape-gpui-ios"
version = "0.3.9"
publish = false
description = "Zed's `gpui_ios` crate (zed@a47f721832, #63068) on the gpui-pre 0.3.9 snapshot, with ducktape's changes (README.ducktape.md)"
readme = "README.ducktape.md"
license = "Apache-2.0"
repository = "https://github.com/zed-industries/zed"
resolver = "2"

[package.metadata.gpui-pre]
zed-crate = "gpui_ios"
zed-version = "0.1.0"
zed-rev = "a47f721832e5b6ecf977891c1b7c6aac1406723e"

[features]
runtime_shaders = ["gpui_apple/runtime_shaders"]

[lib]
name = "ducktape_gpui_ios"
path = "src/gpui_ios.rs"
crate-type = ["staticlib", "rlib"]
doctest = false

[[test]]
name = "text_input"
path = "tests/text_input.rs"
harness = false

[dependencies.gpui]
version = "=0.3.9"
default-features = false
package = "gpui-pre"

[target.'cfg(target_os = "ios")'.dev-dependencies.objc2-ui-kit]
version = "0.3.2"
features = ["UIConversationContext"]

[target.'cfg(target_os = "ios")'.dev-dependencies.slotmap]
version = "1.0.6"

[target.'cfg(target_os = "ios")'.dependencies.anyhow]
version = "1.0.86"

[target.'cfg(target_os = "ios")'.dependencies.block2]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.futures]
version = "0.3.34"

[target.'cfg(target_os = "ios")'.dependencies.gpui_apple]
version = "=0.3.9"
features = ["font-kit"]
package = "gpui-pre-apple"

[target.'cfg(target_os = "ios")'.dependencies.log]
version = "0.4"
features = ["std"]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.objc2-core-foundation]
version = "0.3.2"

[target.'cfg(target_os = "ios")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "NSArray",
    "NSAttributedString",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSJSONSerialization",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSOperation",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSThread",
    "NSURL",
    "NSValue",
    "block2",
    "objc2-core-foundation",
    "std",
]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2-quartz-core]
version = "0.3.2"
features = [
    "CADisplayLink",
    "CALayer",
    "CAMetalLayer",
    "std",
]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.3.2"
features = [
    "NSText",
    "UIApplication",
    "UIEditMenuInteraction",
    "UIEvent",
    "UIGeometry",
    "UIInteraction",
    "UIInterface",
    "UIMenuController",
    "UIOpenURLContext",
    "UIPasteboard",
    "UIResponder",
    "UIScene",
    "UISceneConfiguration",
    "UISceneDefinitions",
    "UISceneOptions",
    "UISceneSession",
    "UIScreen",
    "UITextInput",
    "UITextInputTraits",
    "UITouch",
    "UITraitCollection",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "std",
]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.parking_lot]
version = "0.12.1"

[target.'cfg(target_os = "ios")'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.uuid]
version = "1.1"
features = ["serde", "v5"]

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
