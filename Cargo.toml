# app — the native GPUI desktop shell.
#
# The app is a BLIND HOST: it connects to a node, reads the roster, fetches
# each program's view and renders it. It knows no program by name; every
# view request names its own target and the app relays the bytes. Source
# here is the app crate and its self-update (`crates/updater`);
# everything else arrives as a cargo git dependency.
#
# The app updates itself (`src/update.rs`): `crates/updater` is the pure
# state machine and the release signer, and the one executable runs the boot
# step (flip, rollback, exec) at the top of its `main`.

[package]
name = "ducktape-app"
edition.workspace = true
version.workspace = true
publish = false
description = "A local-first consensus workspace for people and agents"
authors = ["Ducktape contributors"]


[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]

# --- sdk-line: crates/sdk of ducktape-industries/programs (abi, view-wire, program, ducklink, design, describe). Every crate of that repo here and below sits on ONE rev, and the views this app seats are built at that rev. One whose manifest's wire_id is not `view_wire::WIRE_ID` runs all the same, and a failure of it names both wires and the node (`View::failure`). Which rev and why is in `git log -- Cargo.toml`. ---
abi = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "abi" }
view-wire = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "view-wire" }
# `program::is_name`: the one spelling of a program id
program = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "program" }
ducklink = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "ducklink" }
design = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "design" }
# `program.describe`: the runner a program's untrusted describe module goes through
describe = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "describe" }
# the identity program's own types: the app's passkey lane and `crates/noded-client`'s flows
identity = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "identity" }

# --- node-side: ducktape-industries/ducktape on the kernel branch ---
ducktape-home = { git = "https://github.com/ducktape-industries/ducktape", branch = "feat/capable-sandbox", package = "ducktape-home" }
keystore = { git = "https://github.com/ducktape-industries/ducktape", branch = "feat/capable-sandbox", package = "keystore" }
blob = { git = "https://github.com/ducktape-industries/ducktape", rev = "a4360f6d6ac3b807df95e3fda24d8d8a8b130049", package = "blob" }

# --- external ---
borsh = { version = "1", default-features = false, features = ["derive", "std"] }
tracing = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand = "0.8"
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
tempfile = "3"
zeroize = "1"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# wasmtime — pinned exactly, matching the node's runtime: a program-owned view
# executes in the same wasm semantics the kernel does.
wasmtime = "=46.0.3"
libc = "0.2"

[features]
# dev and qa builds only (owner, 2026-09-28): gpui's own frame and input
# histograms and its first present into `GET /perf` (docs/perf.md §3.5).
# A default build compiles none of it: hdrhistogram is not in its graph.
perf-deep = ["gpui-kit/profiler", "ducktape-host/perf-deep"]
# kit and qa builds only (chief, 2026-10-01, hub audit Q7): the AX door
# (crates/host/src/ax) and its `ducktape-app ax` client. A default build
# compiles none of it: DUCKTAPE_AX_DOOR does nothing there.
ax-door = ["ducktape-host/ax-door"]
# The web view: a view whose manifest declares `web` draws pages through CEF
# off-screen rendering (`crates/host/src/render/web.rs`, `crates/web`), and
# https links open in it. A default build compiles none of CEF and links no
# libcef: the web piece says the build has no web view, and https links go
# to the system browser.
web = ["ducktape-host/web"]

[dependencies]
# the blind host core, shared with the phone
ducktape-host = { path = "crates/host" }
gpui-kit = "=0.7.3"
gpui-base = "=0.7.3"
futures.workspace = true
design.workspace = true
sha2.workspace = true
ducktape-home.workspace = true
keystore.workspace = true
# This device's key, kept by the OS (`backend/device_key.rs`): Keychain,
# Credential Manager, Secret Service (over zbus, no libdbus to link).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
# The passkey lane (`backend/passkey.rs`): the verifier the node runs (to
# pick which passkey signed and to frame its assertion), and the identity
# program's own types, so a Create/AddKey/Consent is the program's bytes.
keyscheme = { git = "https://github.com/ducktape-industries/ducktape", rev = "9dfffb0662bd8a16293df8c75de8817a79b0810b", package = "keyscheme" }
identity.workspace = true
valset = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "valset" }
base64.workspace = true
commonware-cryptography.workspace = true
commonware-codec.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true
view-wire = { workspace = true, features = ["manifest"] }
program.workspace = true
abi.workspace = true
borsh.workspace = true
ducklink.workspace = true
libc.workspace = true
# the node's client, shared with the phone; `commonware`: the device key
# (commonware's ed25519) signs through it
noded-client = { path = "crates/noded-client", features = ["commonware"] }
# self-update: the state machine, the manifest and its signature
ducktape-updater = { path = "crates/updater" }
# the release archive a self-update downloads (`.tar.gz`)
tar = { version = "0.4", default-features = false }
flate2 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSError", "NSDictionary", "NSObject"] }
objc2-user-notifications = { version = "0.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSound", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse"] }

# Everywhere else the notifier is the freedesktop notifications service, one
# `Notify` call on the session bus. zbus is already in this binary's graph
# under the accessibility stack; this only names it.
[target.'cfg(not(target_os = "macos"))'.dependencies]
zbus = "5"

[dev-dependencies]
# the host core's test helpers (`*_for_test`, `test_style`, the door)
ducktape-host = { path = "crates/host", features = ["test-support", "ax-door"] }
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
tempfile.workspace = true
keyscheme = { git = "https://github.com/ducktape-industries/ducktape", rev = "9dfffb0662bd8a16293df8c75de8817a79b0810b", package = "keyscheme", features = ["testkit"] }
p256 = "0.13"

[patch."https://github.com/ducktape-industries/ducktape"]
abi = { git = "https://github.com/ducktape-industries/programs", rev = "118f79e7859c4ccbc18e3a3372b07df93db24212", package = "abi" }

[patch.crates-io]
gpui-pre-wgpu = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }
rmp-serde = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }
gpui-pre = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }
# Window::set_bounds (X11, macOS) and the Linux clipboard reads' wait hook
# (`crates/web`): the backends, vendored in the fork
gpui-pre-linux = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }
gpui-pre-macos = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }
# the X11 input-method client gpui-pre-linux uses, vendored in the fork: it decodes
# Hangul and Chinese from ibus and drops (does not panic on) text it cannot decode
zed-xim = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "02724886f436f4f5b01ebfc1fb5cd37c09809a79" }

# Symbols are a fifth of the binary and nothing at run time reads them.
[profile.release]
strip = true

# What release.yml ships: fat LTO in one codegen unit is 30% smaller than
# `release` (85 vs 122 MB) at no measured hover or zoom cost, but a clean
# build takes ~18 min and an app change relinks for ~11, so local release
# builds (the perf rig) stay on `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# dev/test builds compile wasm views through cranelift (program-owned view
# fixtures); unoptimized cranelift is 10-30x slower, so the code generator
# itself is always built optimized. build-time only.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.ducktape-app]
debug = 0
opt-level = 0

# Keep native UI unit test code compact on the default test worker stack.
[profile.test.package.ducktape-app]
debug = 0
opt-level = 1

# sha256 over a whole app binary (the self-update's install, and every
# archive it stages): half a minute unoptimized, under a second optimized.
[profile.dev.package.sha2]
opt-level = 3

# Optimize the native render and text stack without slowing unrelated workspace crates.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.design]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.yazi]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.lyon]
opt-level = 2

[profile.dev.package.lyon_algorithms]
opt-level = 2

[profile.dev.package.lyon_geom]
opt-level = 2

[profile.dev.package.lyon_path]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

# The sign-in unlock, and every signed write after it, runs one argon2id pass
# over a 64 MiB buffer — the KDF is SUPPOSED to be expensive, but only at its
# release speed.
[profile.dev.package.argon2]
opt-level = 3

