# ducktape-app — the native GPUI desktop shell.
#
# Split out of the ducktape monorepo: the app crate itself, its boot-time
# launcher (bin/app-launcher) and the gpui-notion editor it embeds are
# source here; everything else it links (the module wire crates, view-wire
# and design from ducktape-sdk; the node-side platform crates from
# ducktape-industries/ducktape) arrives as a cargo git dependency.

[workspace]
resolver = "2"
members = [
    "app",
    "bin/app-launcher",
    "crates/gpui-notion",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# --- source in this repo ---
gpui-notion = { path = "crates/gpui-notion" }

# --- sdk-line: ducktape-sdk (types-only wire/platform crates) ---
sdk = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "sdk" }
keyscheme = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "keyscheme" }
# view-wire is pinned apart from the rest of the sdk line: the host and
# presenter speak epoch 10 (81953e6). Core's noded links its own view-wire
# privately (bindgen + manifest), so no type crosses between them.
view-wire = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "81953e68d0e8ceb142c49d2ad5397d55c3322578", package = "view-wire" }
# the `duck://` grammar, at the view-wire rev: the rest of the line's
# duck-address (5fa05de) has no typed tails and no account address.
# `duck-address` is the platform address grammar; module tails stay in the app.
duck-address = { git = "https://github.com/ducktape-industries/ducktape-sdk", rev = "81953e68d0e8ceb142c49d2ad5397d55c3322578", package = "duck-address" }
design = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "design" }

# --- node-side: ducktape-industries/ducktape ---
node = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "node" }
media-service = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "media-service" }
ducktape-rpc = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "ducktape-rpc" }
module-artifact = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "module-artifact" }
keystore = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "keystore" }
run-envelope = { git = "https://github.com/ducktape-industries/ducktape-sdk", branch = "dev", package = "run-envelope" }
app-update = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "app-update" }
ducktape-home = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "ducktape-home" }
simnode = { git = "https://github.com/ducktape-industries/ducktape", branch = "dev", package = "simnode" }

# --- external ---
tracing = "0.1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rand = "0.8"
commonware-cryptography = "2026.9.0"
commonware-codec = "2026.9.0"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = "0.13"
unicode-normalization = "0.1"
base64 = "0.22"
tempfile = "3"
zeroize = "1"
# wasmtime — pinned exactly, matching the node's runtime: a module-owned view
# executes in the same wasm semantics the kernel does.
wasmtime = "=46.0.3"
libc = "0.2"

# gpui-pre 0.3.5 + the headless accessibility tree, rev 021b436617db8bf377ad384b464cd1b34692f35e
# of the private ducktape-industries/gpui-pre: the test window keeps the tree
# it is sent and a window can be switched to build one with no assistive tech
# attached, which the #114 `ax_contract` gate needs; a window's last tree, the
# element behind each node and the adapter's action path are public at run
# time, which the #114 test door (`app/src/ax_door.rs`) reads. Dies when the upstream
# PR (pending; described in that repo's README) lands and gpui-kit takes it.
[patch.crates-io]
gpui-pre = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "021b436617db8bf377ad384b464cd1b34692f35e" }

# dev/test builds compile wasm guests through cranelift (module-owned view
# fixtures); unoptimized cranelift is 10-30x slower, so the code generator
# itself is always built optimized. build-time only.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.ducktape-app]
debug = 0
opt-level = 0

# Keep native UI unit test code compact on the default test worker stack.
[profile.test.package.ducktape-app]
debug = 0
opt-level = 1

# Optimize the native render and text stack without slowing unrelated workspace crates.
[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.dev.package.design]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.yazi]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

[profile.dev.package.unicode-segmentation]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.lyon]
opt-level = 2

[profile.dev.package.lyon_algorithms]
opt-level = 2

[profile.dev.package.lyon_geom]
opt-level = 2

[profile.dev.package.lyon_path]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.usvg]
opt-level = 2

# The native document readers parse Markdown on their presentation path.
[profile.dev.package.pulldown-cmark]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

# The sign-in unlock, and every signed write after it, runs one argon2id pass
# over a 64 MiB buffer — the KDF is SUPPOSED to be expensive, but only at its
# release speed.
[profile.dev.package.argon2]
opt-level = 3

# The huddle's per-frame video codecs; see media-service's own module docs.
[profile.dev.package.media-service]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.mozjpeg]
opt-level = 3

[profile.dev.package.mozjpeg-sys]
