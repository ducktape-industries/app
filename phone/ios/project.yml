# The phone's iOS launcher (XcodeGen): `App.swift`, the Expo build's
# `DeviceKeyStore.swift` as it is, and the Rust library `phone/Makefile`
# builds into `build/rust/<platform>` with the link flags rustc prints
# (`build/rust/<platform>/link.xcconfig`). Simulator builds sign ad hoc; the
# App Store archive is unsigned and signed on export by the TestFlight
# workflow (`phone/README.md`).
name: Ducktape
options:
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Debug: build/rust/link.xcconfig
  Release: build/rust/link.xcconfig
targets:
  Ducktape:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - DucktapeDriver
    sources:
      - App.swift
      - DeviceKeyStore.swift
      - Phone.h
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      # a notice's sound, which `assets/sounds/quack.py` makes
      - path: ../../assets/sounds/quack.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Ducktape
        PRODUCT_BUNDLE_IDENTIFIER: industries.ducktape.mobile
        INFOPLIST_FILE: Info.plist
        # Push Notifications (PushKit's VoIP pushes, the ring): the App ID must have it on
        CODE_SIGN_ENTITLEMENTS: Ducktape.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CFBundleVersion; the TestFlight workflow passes its own (the commit's time)
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Phone.h
        TARGETED_DEVICE_FAMILY: "1"
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -lducktape_phone $(RUST_NATIVE_LIBS)
        ENABLE_BITCODE: NO
        # the Rust library is built for the Apple-silicon simulator only
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  DucktapeDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Driver
    dependencies:
      - target: Ducktape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: industries.ducktape.mobile.driver
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: Ducktape
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
